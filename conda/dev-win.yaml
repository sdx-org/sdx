name: hiperhealth
channels:
  - conda-forge
  - nodefaults

dependencies:
  - python >=3.10,<=3.13
  - pip
  - setuptools  # required for pkg_resources used by mkdocs-macros-plugin
  - nodejs  # used by semantic-release
  - tesseract
  - libmagic
  - uv
  - pip:
      - paginate==0.5.6  # distlib issue
